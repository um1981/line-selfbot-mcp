<!DOCTYPE html>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #FFFFFF;
      --color-ink:     #2D3142;
      --color-muted:   #4F5D75;
      --color-accent:  #EB6C36;
      --font-sans:     'Segoe UI Variable', 'Leelawadee UI', 'Tahoma', system-ui, sans-serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.4rem, 2.2vw + 0.6rem, 1.85rem);
      font-weight: 600;
      line-height: 1.4;
      color: var(--color-ink);
      margin-bottom: 1.25rem;
    }
    svg {
      width: 100%;
      min-width: 1040px;
      display: block;
      text-rendering: optimizeLegibility;
      font-feature-settings: "mark" 1, "mkmk" 1, "ccmp" 1;
    }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
